name: Version drift report

# Reports, never bumps. See docs/versioning.md for the bump policy and
# tests/scripts/check-version-drift.sh for exactly what this checks (and,
# in its header comment, what it deliberately cannot see without a public
# API: this module has no cloud account and no cluster of its own).
on:
  schedule:
    # Every Monday 09:00 UTC. Weekly is frequent enough to catch drift
    # before it compounds across several upstream releases, and infrequent
    # enough that nobody needs to triage it more than once a week.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# One run at a time: an overlapping workflow_dispatch and scheduled run
# would both miss the other's not-yet-created tracking issue and open a
# duplicate.
concurrency:
  group: version-drift
  cancel-in-progress: false

jobs:
  drift:
    name: check for outdated pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # `shell: bash` adds `-o pipefail`, which the default shell lacks. The
      # script itself exits 0 by design, so this only matters if it
      # crashes; without pipefail `tee` would hide that and the step below
      # would sync a truncated report to the tracking issue as if it were
      # complete.
      - name: run tests/scripts/check-version-drift.sh
        shell: bash
        run: tests/scripts/check-version-drift.sh | tee -a report.md "$GITHUB_STEP_SUMMARY"

      # The script itself never fails the build (see its own header):
      # every pin it flags is release-sized work per docs/versioning.md,
      # not something CI should auto-bump or gate on. But a report that
      # only ever posts to a scheduled run's job summary is invisible
      # unless someone remembers to open the Actions tab, which defeats
      # the point of automating this at all. Sync it to one tracking issue
      # labelled version-drift instead, so a stale pin shows up in the same
      # place every other piece of repo work does, and a successful
      # scheduled run still surfaces its own drift.
      #
      # The body is always replaced with the latest report. A comment
      # listing new and resolved findings is posted only when the set of
      # DRIFT:/ERROR: lines changes (an issue body edit notifies nobody), a
      # clean report closes the issue, and findings that return while it is
      # closed reopen it instead of opening a duplicate. Closing the issue
      # by hand while the findings stay the same is respected: later
      # reports only refresh the body. tests/scripts/drift-issue-sync.sh
      # makes that decision (its own offline self-test runs via `task
      # version-drift`); this step only calls gh.
      - name: sync tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="version-drift"
          title="Version drift report (automated)"

          # tracker <json>: the exact-title match closed last (closedAt),
          # then the highest number; open issues have no closedAt.
          tracker() {
            jq -r --arg t "$title" 'map(select(.title == $t)) | sort_by([.closedAt // "", .number]) | last | .number // empty'
          }
          # labelled <json> <number>: that issue already carries the label.
          labelled() {
            jq -e --argjson n "$2" --arg l "$label" 'any(.[]; .number == $n and any(.labels[]; .name == $l))' <<<"$1" >/dev/null
          }
          fields=number,title,closedAt,labels
          # Open labelled tracker first. Then an open unlabelled one (opened
          # before the label existed), which gets the label. Then the most
          # recently closed one, labelled or not, so drift coming back
          # reopens it instead of opening a duplicate.
          state=open
          needs_label=""
          number="$(gh issue list --label "$label" --state open --limit 100 --json "$fields" | tracker)"
          if [[ -z "$number" ]]; then
            number="$(gh issue list --state open --search "\"$title\" in:title" --limit 100 --json "$fields" | tracker)"
            [[ -z "$number" ]] || needs_label=1
          fi
          if [[ -z "$number" ]]; then
            state=closed
            closed="$({
              gh issue list --label "$label" --state closed --limit 100 --json "$fields"
              gh issue list --state closed --search "\"$title\" in:title" --limit 100 --json "$fields"
            } | jq -s 'add')"
            number="$(tracker <<<"$closed")"
            if [[ -n "$number" ]] && ! labelled "$closed" "$number"; then
              needs_label=1
            fi
          fi
          if [[ -n "$number" ]]; then
            gh issue view "$number" --json body --jq '.body' >previous.md
          else
            state=none
            : >previous.md
          fi

          action="$(tests/scripts/drift-issue-sync.sh action report.md previous.md "$state")"
          echo "tracking issue: ${number:-none} (${state}); action: ${action}"

          case "$action" in
            abort)
              echo "::error::the report is incomplete (its last line is not a valid summary, or the counts disagree with its lines); leaving the tracking issue unchanged"
              exit 1
              ;;
            # noop means no state change: no issue exists yet (nothing to
            # create for a clean report), or a closed issue is already
            # clean. An existing closed issue still needs its label and
            # body refreshed, so only skip entirely when there is no issue.
            noop)
              [[ -n "$number" ]] || exit 0
              ;;
            create | update | comment | reopen | close | close-quiet) ;;
            *)
              echo "::error::unexpected action '${action}' from drift-issue-sync.sh"
              exit 1
              ;;
          esac

          gh label create "$label" --force --color D93F0B \
            --description "Automated weekly version drift report (tests/scripts/check-version-drift.sh)"
          if [[ -n "$needs_label" ]]; then
            gh issue edit "$number" --add-label "$label"
          fi

          case "$action" in
            create)
              gh issue create --title "$title" --label "$label" --body-file report.md
              ;;
            update | noop)
              gh issue edit "$number" --body-file report.md
              ;;
            comment | reopen)
              gh issue edit "$number" --body-file report.md
              header="Findings changed in [workflow run](${RUN_URL})."
              if [[ "$action" == "reopen" ]]; then
                gh issue reopen "$number"
                header="Reopening: findings changed in [workflow run](${RUN_URL})."
              fi
              {
                echo "$header"
                echo
                tests/scripts/drift-issue-sync.sh changes previous.md report.md
              } >comment.md
              gh issue comment "$number" --body-file comment.md
              ;;
            close)
              gh issue edit "$number" --body-file report.md
              gh issue close "$number" --comment "No drift and no errors in [workflow run](${RUN_URL}). Closing; the next report with findings reopens this issue."
              ;;
            close-quiet)
              # Already clean (for example reopened by hand): no finding
              # changed, so close without a comment.
              gh issue edit "$number" --body-file report.md
              gh issue close "$number"
              ;;
          esac
