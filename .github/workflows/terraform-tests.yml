name: Terraform Tests

# Automatic on push to main and on every pull request, plus manual dispatch.
#
# These triggers were briefly reduced to workflow_dispatch only, to spare a
# single shared self-hosted runner from a full terraform matrix per commit
# during a high-frequency porting session. That is a property of one runner,
# not of this module: leaving it that way ships a repository whose CI never
# runs on a contributor's PR, which quietly removes the static analysis and
# test gates the quality bar in AGENTS.md depends on. Throttle a constrained
# runner at the runner, not by disarming the workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The throttle that makes the automatic triggers above safe on a single shared
# runner: one in-flight run per branch, and a new commit cancels the run it
# supersedes instead of queueing behind it. A rapid series of commits costs one
# run at the tip rather than one per commit, which is the only outcome anybody
# wanted from those commits anyway.
#
# Deliberately keyed on ref, not on run_id: same-branch runs must collide.
# main and each PR still run independently.
#
# Cancellation stops at main. On a branch, superseding a run costs nothing: the
# tip is the only commit anybody is waiting on. On main it would mean a commit
# that never receives a completed run at all, whenever another lands behind it
# quickly - and "every commit on main has a green run" is the claim a release
# tag rests on. Those runs queue instead, which is the right way round: the
# constrained runner is worth protecting from PR churn, not from the handful of
# commits that reach main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write

env:
  # Every job except test-floor and test-opentofu runs this version: the
  # current latest stable, so there is one deliberately tracked latest
  # version to bump rather than a moving target. TF_FLOOR_VERSION below
  # tracks the module's declared floor instead, and test-opentofu reads
  # TOFU_VERSION, its own independent pin (see the comment on that variable).
  #
  # The `test-floor` job also runs the `terraform test` suites on
  # TF_FLOOR_VERSION, a release the module's `>= 1.11` floor admits (the
  # newest 1.11.x patch, not the lowest one the constraint itself would
  # accept).
  # A floor CI never runs is a claim nobody is checking, and this repo has
  # already been bitten by the specific version-skew hazard that hides behind
  # one: Terraform's `&&`/`||` do not short-circuit before 1.12 (see
  # AGENTS.md), one minor above this floor, so the seven examples'
  # `shared_storage_class` validation failed on 1.11.4 while CI's own
  # newer-than-1.12 pin passed it silently. `tests/scripts/check-terraform-floor.sh`
  # fails the job if TF_FLOOR_VERSION and every versions.tf's
  # required_version ever drift apart at major.minor granularity.
  TF_VERSION: "1.17.0"
  TF_FLOOR_VERSION: "1.11.4"
  # OpenTofu is a second supported consumer of this module (published to
  # both the Terraform and OpenTofu registries), tracked here as its own
  # pin rather than reusing TF_VERSION: the two tools version independently
  # and "latest stable tofu" and "latest stable terraform" are not the same
  # release. test-opentofu below is the only job that reads this.
  TOFU_VERSION: "1.13.2"
  TFLINT_VERSION: "v0.64.0"
  # NOTE: the tflint job resolves its config with `git rev-parse --show-toplevel`
  # rather than an env var here. `${{ github.workspace }}` is empty on the
  # self-hosted runner this repo also builds on, TFLINT_CONFIG_FILE resolved to
  # "/.tflint.hcl" and every tflint job failed to load it. Do not reintroduce
  # that expression anywhere in this file.
  # checkov results are version-dependent, so this gate pins one version rather
  # than tracking latest. tests/scripts/check-checkov.sh reads this value and
  # refuses to run against a different local version, which makes this line the
  # single source of truth for both. Bumping it is a deliberate change: expect a
  # new release to report findings that need triaging in the same commit.
  CHECKOV_VERSION: "3.3.30"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Shared provider plugin cache across the validate/test/tflint matrices.
  # `terraform init` fills this from the registry on a cache miss and reuses
  # it on a hit, keyed below on the .terraform.lock.hcl files committed at
  # the module root and in each examples/* root module. A literal absolute path
  # rather than a workspace expression: every job here is ubuntu-latest, and
  # `${{ github.workspace }}` is empty on that same self-hosted runner (it resolved to
  # "/.terraform-plugin-cache", which survived only because "/" happened to be
  # writable in the job container).
  TF_PLUGIN_CACHE_DIR: "/tmp/.terraform-plugin-cache"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive -diff

  naming:
    name: variable naming families
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: every root input is in a known naming family
        run: ./scripts/check-variable-prefixes.sh

  inputs-reach-workload:
    name: declared inputs reach the workload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: every declared input is wired, and every claimed env var renders
        run: python3 ./scripts/check-inputs-reach-workload.py

  example-parity:
    name: example parity (variables and shared-storage docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: examples/homelab-* stay in step with examples/homelab
        run: ./scripts/check-example-parity.sh

  docs:
    name: terraform-docs (README in sync)
    runs-on: ubuntu-latest
    env:
      # Tracks the version `brew install terraform-docs` installs on macOS, so
      # contributors don't need a special install path. Different terraform-docs
      # versions emit different markdown table whitespace, so any drift between
      # CI and the version contributors actually use produces spurious diffs in
      # the --output-check steps below. Bump together with the brew default:
      # this pin sat at v0.22.0 while brew moved to v0.24.0, which is the same
      # trap the floating checkov version fell into (see CHECKOV_VERSION above).
      # It happened to be harmless here, because the two versions render this
      # repo's tables identically, but that was luck rather than design.
      TERRAFORM_DOCS_VERSION: v0.24.0
    steps:
      - uses: actions/checkout@v7

      - name: install terraform-docs
        run: |
          set -euo pipefail
          # Arch is derived, not assumed. Hardcoding amd64 here downloads a
          # binary that unpacks and installs happily on an arm64 runner and then
          # dies at first use with "cannot execute binary file: Exec format
          # error" (exit 126) - which reads like a corrupt download, not a
          # portability bug. That self-hosted runner is ARM-based;
          # GitHub's hosted runners are x86_64. Both are supported upstream.
          case "$(uname -m)" in
            x86_64)        TD_ARCH=amd64 ;;
            aarch64|arm64) TD_ARCH=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sSLo /tmp/td.tar.gz \
            "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-$(uname)-${TD_ARCH}.tar.gz"
          tar -xzf /tmp/td.tar.gz -C /tmp terraform-docs
          sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      # All formatting options live in .terraform-docs.yml so these commands
      # stay identical to what contributors run locally.
      - name: terraform-docs --output-check (root)
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/homelab)
        working-directory: examples/homelab
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/homelab-pgbouncer)
        working-directory: examples/homelab-pgbouncer
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/homelab-cloudflare)
        working-directory: examples/homelab-cloudflare
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/homelab-godaddy)
        working-directory: examples/homelab-godaddy
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/homelab-split-ingress)
        working-directory: examples/homelab-split-ingress
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/homelab-cloudflare-split-ingress)
        working-directory: examples/homelab-cloudflare-split-ingress
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/homelab-ai-assistant)
        working-directory: examples/homelab-ai-assistant
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (modules/cluster-capacity)
        working-directory: modules/cluster-capacity
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (modules/tls-letsencrypt)
        working-directory: modules/tls-letsencrypt
        run: terraform-docs --output-check .

  validate:
    name: terraform validate (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [".", "examples/homelab", "examples/homelab-pgbouncer", "examples/homelab-cloudflare", "examples/homelab-godaddy", "examples/homelab-split-ingress", "examples/homelab-cloudflare-split-ingress", "examples/homelab-ai-assistant", "modules/cluster-capacity", "modules/tls-letsencrypt"]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: cache terraform providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-

      - name: terraform init (no backend, providers only)
        working-directory: ${{ matrix.target }}
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR" && terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.target }}
        run: terraform validate -no-color

  test:
    name: terraform test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        target: [".", "examples/homelab", "examples/homelab-pgbouncer", "examples/homelab-cloudflare", "examples/homelab-godaddy", "examples/homelab-split-ingress", "examples/homelab-cloudflare-split-ingress", "examples/homelab-ai-assistant", "modules/cluster-capacity", "modules/tls-letsencrypt"]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: cache terraform providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-

      - name: terraform init
        working-directory: ${{ matrix.target }}
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR" && terraform init -backend=false

      - name: terraform test
        working-directory: ${{ matrix.target }}
        # tests/opentofu-gaps/ holds runs that a known OpenTofu gap can't
        # execute (see test-opentofu's comment below); real Terraform has
        # no such gap, so this still runs them, as part of the suite.
        run: |
          terraform test -verbose
          if [ -d tests/opentofu-gaps ]; then
            terraform test -test-directory=tests/opentofu-gaps -verbose
          fi

  # The same suites as `test`, on TF_FLOOR_VERSION instead of TF_VERSION. A
  # separate job rather than a matrix dimension on `test`, so the existing
  # check names stay unchanged and each version is defined once (a matrix
  # value cannot read `env`). The `target:` list below must stay in lockstep
  # with `test`'s own list just above (and with `validate`/`tflint`'s,
  # `test-opentofu`'s below, and with Taskfile.yml's EXAMPLES/SUBMODULES
  # vars): a root missing from one list passes its floor (or OpenTofu) job
  # without ever running there.
  test-floor:
    name: terraform test on floor (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        target: [".", "examples/homelab", "examples/homelab-pgbouncer", "examples/homelab-cloudflare", "examples/homelab-godaddy", "examples/homelab-split-ingress", "examples/homelab-cloudflare-split-ingress", "examples/homelab-ai-assistant", "modules/cluster-capacity", "modules/tls-letsencrypt"]
    steps:
      - uses: actions/checkout@v7

      - name: required_version matches TF_FLOOR_VERSION
        if: matrix.target == '.'
        run: tests/scripts/check-terraform-floor.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_FLOOR_VERSION }}

      - name: cache terraform providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-

      - name: terraform init
        working-directory: ${{ matrix.target }}
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR" && terraform init -backend=false

      - name: terraform test
        working-directory: ${{ matrix.target }}
        # tests/opentofu-gaps/ holds runs that a known OpenTofu gap can't
        # execute (see test-opentofu's comment below); real Terraform has
        # no such gap, so this still runs them, as part of the suite.
        run: |
          terraform test -verbose
          if [ -d tests/opentofu-gaps ]; then
            terraform test -test-directory=tests/opentofu-gaps -verbose
          fi

  # OpenTofu is a second supported consumer of this module: it is published
  # to both the Terraform and OpenTofu registries. This job proves `tofu
  # init`/`tofu test` on the pinned TOFU_VERSION, on the same roots as
  # `test`/`test-floor` above, using OpenTofu's own binary rather than
  # hashicorp/setup-terraform. The `target:` list must stay in lockstep with
  # `test`'s own list above (see that job's comment for the full list of
  # places this has to match).
  test-opentofu:
    name: tofu test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        target: [".", "examples/homelab", "examples/homelab-pgbouncer", "examples/homelab-cloudflare", "examples/homelab-godaddy", "examples/homelab-split-ingress", "examples/homelab-cloudflare-split-ingress", "examples/homelab-ai-assistant", "modules/cluster-capacity", "modules/tls-letsencrypt"]
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: cache opentofu providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tofu-providers-

      - name: tofu init
        working-directory: ${{ matrix.target }}
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR" && tofu init -backend=false

      - name: tofu test
        working-directory: ${{ matrix.target }}
        run: tofu test -verbose

      # Two targets also carry a tests/opentofu-gaps/ directory: known
      # OpenTofu testing-framework gaps rather than defects in this
      # module's resources or variables, isolated there (out of the
      # default "tests" directory both tools scan) so they cannot taint
      # the two steps above. continue-on-error is scoped to this one step,
      # which runs only those isolated files, not the rest of either
      # suite: a real regression anywhere else still blocks the job.
      #
      # "." (root): tests/opentofu-gaps/password-rotation-override-during.tftest.hcl's
      # "enabling_rotation_roll_reaches_both_releases" run uses
      # override_resource's override_during = plan (needed to assert a
      # plan-time value on random_password.valkey_default[0], an unknown
      # that only resolves at apply otherwise). OpenTofu v1.13.2's
      # override_resource block supports only target/values; it has no
      # override_during argument, so `tofu init` rejects the test file
      # outright with "Unsupported argument" before any test can run, and
      # init scans every *.tftest.hcl file under its test directory
      # regardless of which one holds the invalid argument. That is why
      # this run has to sit outside "tests" entirely rather than merely in
      # its own file there: leaving it in "tests" would fail `tofu init`
      # above for the whole root module, not just this one step. Revisit
      # when OpenTofu ships override_during (tracked upstream; none of
      # this module's other targets hit it, since override_during is used
      # nowhere else in the tree).
      #
      # "." (root): tests/opentofu-gaps/cluster-capacity-module-instantiation-gap.tftest.hcl's
      # run asserts length(module.cluster_capacity) == 1. OpenTofu v1.13.2's
      # test runner cannot resolve that for a count-conditioned module with
      # zero output blocks: it always reports an empty tuple regardless of
      # the module's real instance count. modules/cluster-capacity
      # deliberately has no outputs (a pure check-based advisory), so this
      # is a test-runner limitation rather than a reason to add one. See
      # that gap file's header for the minimal reproduction.
      #
      # "." (root): tests/opentofu-gaps/nullable-variable-null-override-gap.tftest.hcl's
      # run sets four webhook quantity variables and n8n_reinstall_missing_packages
      # to null through its own `variables` block and asserts each falls
      # back to its nullable = false default. OpenTofu v1.13.2's `tofu test`
      # does not apply that fallback on its own run-level variable
      # overrides, even though OpenTofu's own language docs and real
      # Terraform both do. See that gap file's header for the minimal
      # reproduction.
      #
      # "modules/cluster-capacity": tests/opentofu-gaps/override-data-field-gap.tftest.hcl's
      # override_data blocks for data.kubernetes_nodes.capacity supply a
      # partial metadata object (just { name = "..." }), relying on
      # Terraform auto-generating the remaining computed sub-attributes
      # (annotations, generation, labels, resource_version, uid).
      # OpenTofu v1.13.2 does not auto-fill those when only some fields of
      # a nested block are given, and rejects the override instead
      # ("Invalid mock/override field `nodes`: ... are required"). This
      # one fails only at tofu test (not tofu init), so the module's one
      # override_data-free run, tests/capacity.tftest.hcl's
      # "an_unavailable_read_says_nothing", stays in the default "tests"
      # directory and blocks normally in the step above. Revisit by
      # supplying every field explicitly in the isolated file (a real fix,
      # portable to both tools) or once OpenTofu's mock generation matches
      # Terraform's here.
      - name: tofu test (known OpenTofu gaps)
        if: matrix.target == '.' || matrix.target == 'modules/cluster-capacity'
        working-directory: ${{ matrix.target }}
        continue-on-error: true
        run: tofu test -test-directory=tests/opentofu-gaps -verbose

  tflint:
    name: tflint (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [".", "examples/homelab", "examples/homelab-pgbouncer", "examples/homelab-cloudflare", "examples/homelab-godaddy", "examples/homelab-split-ingress", "examples/homelab-cloudflare-split-ingress", "examples/homelab-ai-assistant", "modules/cluster-capacity", "modules/tls-letsencrypt"]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: cache terraform providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-

      - name: terraform init (fetch modules for tflint)
        working-directory: ${{ matrix.target }}
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR" && terraform init -backend=false

      # --config is resolved from the git root rather than a workspace variable,
      # so it is correct at every matrix depth (".", "examples/x",
      # "modules/x") and on runners that do not populate github.workspace.
      # Both steps need it: --init reads the config to know which plugins to
      # fetch, and without it the lint step would run the built-in rules only.
      - name: tflint --init
        working-directory: ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init --config="$(git rev-parse --show-toplevel)/.tflint.hcl"

      - name: tflint
        working-directory: ${{ matrix.target }}
        run: tflint --format compact --config="$(git rev-parse --show-toplevel)/.tflint.hcl"

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.11 is the interpreter the pinned checkov was verified against, and the
      # one bridgecrewio's own checkov:3.3.9 image ships.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Installed at a pinned version instead of via bridgecrewio/checkov-action,
      # which bakes the checkov version into its own image: the @v12 tag moves to
      # newer checkov releases on its own schedule. That is not a theoretical
      # problem. 3.3.9 evaluates whole check families (several CKV2_* graph
      # checks among them) against resources reached through a local module
      # source that 3.3.0 skipped silently, which turned a clean
      # local run into ten CI failures on findings nobody had triaged. With this
      # gate at hard-fail, the version has to move only in a deliberate commit
      # that also curates whatever the new release reports.
      - name: install checkov
        run: pip install "checkov==${{ env.CHECKOV_VERSION }}"

      # The same script contributors run, so "clean locally" and "clean in CI"
      # cannot drift apart: it owns the flags, the config file and the exit code.
      # Every finding is curated, either fixed or annotated at the resource with
      # an inline `checkov:skip=<ID>:<reason>`. See issue #27 and CHANGELOG.md.
      # checkov exits non-zero on any new finding, which fails the job.
      - name: checkov
        run: tests/scripts/check-checkov.sh
