# https://taskfile.dev
#
# Wraps the local validation loop documented in AGENTS.md so contributors
# don't need to hand-type the module-root + per-example matrix. CI runs the
# same underlying commands directly (see .github/workflows/terraform-tests.yml);
# this file is a convenience wrapper, not a CI dependency.
version: "3"

vars:
  # Must stay in lockstep with the `target:` matrix lists in
  # .github/workflows/terraform-tests.yml (validate, test, tflint and the
  # per-example terraform-docs steps all enumerate the same set). When the two
  # drift, `task ci` passes locally on a change that breaks an example nobody
  # validated before pushing.
  EXAMPLES: homelab homelab-pgbouncer homelab-cloudflare homelab-godaddy homelab-split-ingress homelab-cloudflare-split-ingress homelab-ai-assistant

  # The two submodules are root modules of their own for verification purposes:
  # each has its own tests, its own README, and its own input contract. CI's
  # matrices include them, so anything that skips them here passes locally and
  # fails on push.
  SUBMODULES: cluster-capacity tls-letsencrypt

tasks:
  init:
    internal: true
    run: once
    cmds:
      - terraform init -backend=false
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && terraform init -backend=false
      - for:
          var: SUBMODULES
          as: SUBMODULE
        cmd: cd modules/{{.SUBMODULE}} && terraform init -backend=false

  fmt:
    desc: Check Terraform formatting across the module and all examples.
    cmds:
      - terraform fmt -check -recursive

  validate:
    desc: terraform init + validate for the module root, every example and both submodules.
    deps: [init]
    cmds:
      - terraform validate
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && terraform validate
      - for:
          var: SUBMODULES
          as: SUBMODULE
        cmd: cd modules/{{.SUBMODULE}} && terraform validate

  test:
    desc: terraform test (plan-time, mocked providers) for the module root, every example and both submodules.
    deps: [init]
    cmds:
      - terraform test -verbose
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && terraform test -verbose
      - for:
          var: SUBMODULES
          as: SUBMODULE
        cmd: cd modules/{{.SUBMODULE}} && terraform test -verbose

  lint:
    desc: tflint for the module root, every example and both submodules.
    deps: [init]
    cmds:
      - tflint --init
      - tflint --format compact
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && tflint --init && tflint --format compact
      - for:
          var: SUBMODULES
          as: SUBMODULE
        cmd: cd modules/{{.SUBMODULE}} && tflint --init && tflint --format compact

  checkov:
    desc: >-
      Static analysis, the same invocation CI runs. Requires the exact checkov
      version CHECKOV_VERSION pins in .github/workflows/terraform-tests.yml;
      the script refuses to run against any other, because which checks apply
      is version-dependent. Install with
      `pip install "checkov==<pinned version>"`.
    cmds:
      - ./tests/scripts/check-checkov.sh

  opentofu-tolerant:
    internal: true
    desc: >-
      Runs tofu init + tofu test in DIR and warns instead of aborting the
      task on failure. Only called for the two targets test-opentofu's CI
      job marks continue-on-error (see .github/workflows/terraform-tests.yml):
      known OpenTofu testing-framework gaps, not defects in this module's
      own resources or variables.
    cmds:
      - |
        set -e
        if ! command -v tofu >/dev/null 2>&1; then
          echo "ERROR: tofu is not on PATH, cannot run tofu test for {{.DIR}}. This is a missing prerequisite, not the known OpenTofu testing-framework gap: install tofu (see task opentofu's own desc) and re-run." >&2
          exit 1
        fi
        cd "{{.DIR}}"
        init_status=0
        tofu init -backend=false || init_status=$?
        if [ "$init_status" -ne 0 ]; then
          echo "ERROR: tofu init failed for {{.DIR}} (exit $init_status). This is an init failure (missing provider, network, or a real configuration break), not the known OpenTofu testing-framework gap, which only ever fails at tofu test." >&2
          exit "$init_status"
        fi
        test_status=0
        tofu test -verbose || test_status=$?
        if [ "$test_status" -ne 0 ]; then
          echo "WARNING: tofu test failed for {{.DIR}} (exit $test_status): known non-blocking OpenTofu gap, see test-opentofu's continue-on-error comment in .github/workflows/terraform-tests.yml" >&2
        fi
        if [ -d "tests/opentofu-gaps" ]; then
          gaps_status=0
          tofu test -test-directory=tests/opentofu-gaps -verbose || gaps_status=$?
          if [ "$gaps_status" -ne 0 ]; then
            echo "WARNING: tofu test (known OpenTofu gaps) failed for {{.DIR}} (exit $gaps_status): isolated in tests/opentofu-gaps, see test-opentofu's matching step in .github/workflows/terraform-tests.yml" >&2
          fi
        fi

  opentofu:
    desc: >-
      tofu init -backend=false + tofu test (plan-time, mocked providers) for
      the module root, every example and both submodules, using OpenTofu's
      own binary instead of Terraform's. Mirrors the test-opentofu CI job,
      including its per-target tolerance: the root and
      modules/cluster-capacity warn and continue past a failure instead of
      aborting the rest of the matrix (two known OpenTofu
      testing-framework gaps, override_during and partial mock metadata;
      see the comments beside test-opentofu in
      .github/workflows/terraform-tests.yml), every other target still
      aborts the task on failure the same way `task test` does. Not part
      of `task ci`: this module is published to both the Terraform and
      OpenTofu registries, but most contributors only have one of the two
      CLIs installed, and CI already runs both unconditionally. Requires
      `tofu` on PATH at TOFU_VERSION (see
      .github/workflows/terraform-tests.yml); install from
      https://github.com/opentofu/opentofu/releases.
    cmds:
      - task: opentofu-tolerant
        vars:
          DIR: "."
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && tofu init -backend=false && tofu test -verbose
      - task: opentofu-tolerant
        vars:
          DIR: "modules/cluster-capacity"
      - cd modules/tls-letsencrypt && tofu init -backend=false && tofu test -verbose

  chart-diff:
    desc: >-
      Diff the pinned n8n chart's values.yaml against a candidate version.
      Requires helm. No terraform, no cluster, no credentials. Usage:
      `task chart-diff CANDIDATE=1.17.0`.
    cmds:
      - ./tests/scripts/chart-values-diff.sh {{.CANDIDATE}}

  chart-coverage:
    desc: >-
      Check docs/helm-chart-coverage.md isn't stale relative to the pinned
      chart version. Requires helm. No terraform, no cluster, no credentials.
    cmds:
      - ./tests/scripts/check-helm-chart-coverage.sh

  chart-check:
    desc: >-
      Render this module's own values tree through the pinned n8n Helm chart
      and assert the behaviors this module's code and tests depend on.
      Requires terraform init -backend=false at the module root (see the
      `init` task), helm and jq. No cluster, no credentials, no plan or apply.
    deps: [init]
    cmds:
      - ./tests/scripts/check-n8n-chart.sh

  version-drift:
    desc: >-
      Report every pinned version (Terraform providers, CI toolchain, the n8n
      and Valkey charts, the n8n application image, the CloudNativePG Postgres
      image) that has fallen behind upstream. Requires curl, jq and python3.
      No terraform, no cloud credentials, no cluster. Report-only: never
      bumps anything and always exits 0 unless a required tool is missing.
      See docs/versioning.md.
    cmds:
      - ./tests/scripts/check-version-drift.sh

  terraform-floor:
    desc: >-
      Check TF_FLOOR_VERSION in .github/workflows/terraform-tests.yml still
      matches every required_version declaration (root, modules/*,
      examples/*). No terraform, no network.
    cmds:
      - ./tests/scripts/check-terraform-floor.sh

  example-parity:
    desc: >-
      Check the seven homelab examples' variable surfaces and shared-storage
      documentation haven't silently drifted apart. Local-only, not CI-gated.
      No terraform, no network.
    cmds:
      - ./scripts/check-example-parity.sh

  banners:
    desc: >-
      Check every variable/output block in variables.tf and outputs.tf sits under
      a "# ── Section ──" banner (see AGENTS.md). Local-only for now, not yet a
      CI-gated check.
    cmds:
      - ./scripts/check-variable-banners.sh

  naming:
    desc: >-
      Check every root input belongs to a naming family (see
      docs/module-contract.md, rule 3.6). Root only, the examples and
      submodules take caller-facing names.
    cmds:
      - ./scripts/check-variable-prefixes.sh

  inputs-reach-workload:
    desc: >-
      Check every declared root input is either referenced outside a check
      block or named in the script's ACK_ONLY list, and that every "Maps to
      ENV_VAR" claim in variables.tf names a variable that input's own code
      path actually renders (see docs/module-contract.md, rule 3.3).
    cmds:
      - python3 ./scripts/check-inputs-reach-workload.py

  docs:
    desc: Check README.md is not stale relative to variables.tf/outputs.tf (module root, every example and both submodules).
    cmds:
      - terraform-docs --output-check .
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && terraform-docs --output-check .
      - for:
          var: SUBMODULES
          as: SUBMODULE
        cmd: cd modules/{{.SUBMODULE}} && terraform-docs --output-check .

  docs-generate:
    desc: Regenerate README.md from variables.tf/outputs.tf (module root, every example and both submodules).
    cmds:
      - terraform-docs .
      - for:
          var: EXAMPLES
          as: EXAMPLE
        cmd: cd examples/{{.EXAMPLE}} && terraform-docs .
      - for:
          var: SUBMODULES
          as: SUBMODULE
        cmd: cd modules/{{.SUBMODULE}} && terraform-docs .

  markdown:
    desc: markdownlint against README.md, docs/*.md, CONTRIBUTING.md, and AGENTS.md (not CHANGELOG.md/ROADMAP.md/SECURITY.md; not CI-gated; see .markdownlint.jsonc).
    cmds:
      - markdownlint README.md CONTRIBUTING.md AGENTS.md docs/*.md

  ci:
    desc: >-
      Run the full local loop (fmt, validate, test, lint, banners, naming,
      inputs-reach-workload, terraform-floor, docs, markdown). Mirrors every
      CI job except checkov and test-opentofu: checkov is a hard-fail gate in
      CI but is left out here because it needs a pinned checkov install that
      the other tasks do not (run `task checkov` separately once you have
      it); test-opentofu is covered by the separate `task opentofu` instead.
      naming and inputs-reach-workload do have their own CI jobs, run here
      too for one local command. Only banners and markdown are local-only,
      not CI-gated at all.
    cmds:
      - task: fmt
      - task: validate
      - task: test
      - task: lint
      - task: banners
      - task: naming
      - task: inputs-reach-workload
      - task: terraform-floor
      - task: docs
      - task: markdown
